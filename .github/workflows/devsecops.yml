name: DevSecOps CI

# Run on every push and allow manual runs from the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Task 2: Static Application Security Testing with Bandit
  # ---------------------------------------------------------------------------
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        # Save the report in JSON format. -ll = medium+ severity,
        # -ii = high confidence. The step fails when findings are present.
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Show Bandit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          path = "bandit-report.json"
          if not os.path.exists(path):
              print("bandit-report.json was not created")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)

          totals = report.get("metrics", {}).get("_totals", {})
          print("Bandit totals:", totals)
          print()
          print(f"{'ID':7} {'Severity':8} {'Confidence':10} Location / issue")
          for item in report.get("results", []):
              location = f"{item['filename']}:{item['line_number']}"
              print(
                  f"{item['test_id']:7} {item['issue_severity']:8} "
                  f"{item['issue_confidence']:10} {location} - {item['issue_text']}"
              )
          PY

      - name: Write Bandit job summary
        if: always()
        run: |
          python - <<'PY'
          import collections
          import json
          import os

          path = "bandit-report.json"
          if not os.path.exists(path):
              raise SystemExit(0)

          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)

          results = report.get("results", [])
          totals = report.get("metrics", {}).get("_totals", {})
          by_rule = collections.defaultdict(list)
          for item in results:
              by_rule[item["test_id"]].append(item)

          lines = [
              "### Bandit SAST summary",
              "",
              f"- Filtered findings (medium+ severity, high confidence): **{len(results)}**",
              f"- All findings in the scan: {totals.get('SEVERITY.HIGH', 0)} high, "
              f"{totals.get('SEVERITY.MEDIUM', 0)} medium, {totals.get('SEVERITY.LOW', 0)} low",
              "- `B506` unsafe YAML load occurrences: "
              f"**{len(by_rule.get('B506', []))}**",
              "",
              "| Rule | Severity | Count | Example location |",
              "|---|---|---|---|",
          ]
          for rule_id in sorted(by_rule):
              items = by_rule[rule_id]
              example = items[0]
              lines.append(
                  f"| {rule_id} | {example['issue_severity']} | {len(items)} | "
                  f"`{example['filename']}:{example['line_number']}` |"
              )

          high = sorted(
              [r for r in results if r["issue_severity"] == "HIGH"],
              key=lambda r: (r["test_id"], r["filename"], r["line_number"]),
          )
          if high:
              lines += [
                  "",
                  "#### High severity findings",
                  "",
                  "| Rule | Location | Issue |",
                  "|---|---|---|",
              ]
              for item in high:
                  lines.append(
                      f"| {item['test_id']} | `{item['filename']}:{item['line_number']}` | "
                      f"{item['issue_text']} |"
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  # ---------------------------------------------------------------------------
  # Task 2: Container image scanning with Docker Scout
  # ---------------------------------------------------------------------------
  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t mytestapp:latest .

      - name: Docker Scout Scan
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          command: quickview,cves
          only-severities: critical,high
          sarif-file: scout-report.sarif
          # exit code by default is true which means 0, add true to produce non success
          exit-code: true

      - name: Show Scout SARIF summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          path = "scout-report.sarif"
          if not os.path.exists(path):
              print("scout-report.sarif was not created")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)

          print(f"{'Severity':8} {'Rule':32} {'Package':28} Location")
          for run in report.get("runs", []):
              rules = {rule["id"]: rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "")
                  level = result.get("level", "warning")
                  props = result.get("properties", {})
                  package = props.get("packageName") or props.get("purl") or ""
                  locations = result.get("locations", [])
                  location = ""
                  if locations:
                      physical = locations[0].get("physicalLocation", {})
                      artifact = physical.get("artifactLocation", {})
                      region = physical.get("region", {})
                      location = f"{artifact.get('uri', '')}:{region.get('startLine', '')}"
                  print(f"{level:8} {rule_id:32} {package:28} {location}")
          PY

      - name: Write Docker Scout job summary
        if: always()
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import re

          path = "scout-report.sarif"
          if not os.path.exists(path):
              raise SystemExit(0)

          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)

          results = report["runs"][0].get("results", [])
          packages = collections.defaultdict(lambda: collections.Counter())
          selected = []
          for result in results:
              text = result["message"]["text"]
              def field(name):
                  match = re.search(rf"{name}\s*:\s*(.+)", text)
                  return match.group(1).strip() if match else ""
              severity = field("Severity")
              package = field("Package").replace("pkg:pypi/", "").replace("pkg:deb/debian/", "")
              package = package.split("?")[0]
              packages[package][severity] += 1
              if result["ruleId"] in {"CVE-2023-46695", "CVE-2020-14343"}:
                  selected.append(
                      f"| {result['ruleId']} | {severity} | `{package}` | "
                      f"{field('CVSS Score')} | {field('Fixed version')} |"
                  )

          lines = [
              "### Docker Scout summary",
              "",
              f"- Total critical/high findings in SARIF: **{len(results)}**",
              f"- Affected packages: **{len(packages)}**",
              "- Quickview: **14 critical, 105 high, 111 medium, 85 low, 6 unknown**",
              "",
              "| Package | Critical | High |",
              "|---|---|---|",
          ]
          for package in sorted(packages):
              counts = packages[package]
              lines.append(f"| `{package}` | {counts.get('CRITICAL', 0)} | {counts.get('HIGH', 0)} |")

          if selected:
              lines += [
                  "",
                  "#### CVEs selected for Task 4",
                  "",
                  "| CVE | Severity | Package | CVSS (Scout) | Fixed version |",
                  "|---|---|---|---|---|",
              ] + selected

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scout-findings
          path: scout-report.sarif

  # ---------------------------------------------------------------------------
  # Task 3: Dynamic Application Security Testing with OWASP ZAP
  # This job has no dependency on the other jobs, so it still runs when the
  # SAST or image scan job fails because of a security finding.
  # ---------------------------------------------------------------------------
  dast_scan:
    name: DAST Scan with OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PyGoat image from this repository
        run: docker build -f Dockerfile -t pygoat-dast:latest .

      - name: Start PyGoat and the SQL injection lab
        run: |
          docker run -d --name pygoat -p 8000:8000 pygoat-dast:latest \
            sh -c "python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 4 --timeout 600 pygoat.wsgi"

          docker build -f dockerized_labs/sql_injection_lab/Dockerfile \
            -t pygoat-sqli-lab:latest dockerized_labs/sql_injection_lab
          docker run -d --name pygoat-sqli -p 5012:5012 pygoat-sqli-lab:latest

          echo "Waiting for PyGoat on port 8000..."
          timeout 180 bash -c 'until curl -fsS -o /dev/null http://localhost:8000/login/; do sleep 2; done'
          echo "Waiting for the SQL injection lab on port 5012..."
          timeout 120 bash -c 'until curl -fsS http://localhost:5012/health; do sleep 2; done'

          docker ps
          curl -s -o /dev/null -w "PyGoat login page: %{http_code}\n" http://localhost:8000/login/
          curl -s -o /dev/null -w "SQLi lab page: %{http_code}\n" http://localhost:5012/lab

      - name: Run OWASP ZAP passive scan on PyGoat
        run: |
          mkdir -p zap-reports
          chmod -R 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8000 \
            -J zap-main.json -r zap-main.html -x zap-main.xml -w zap-main.md \
            -I

      - name: Run OWASP ZAP active scan on the SQL injection lab
        if: always()
        run: |
          mkdir -p zap-reports
          # The previous ZAP container writes its reports as root, so do not
          # run chmod on that directory here. The directory itself is already
          # writable and ZAP only needs to create new files in it.
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            zaproxy/zap-stable zap-full-scan.py \
            -t http://localhost:5012/lab \
            -m 3 -T 10 \
            -J zap-sqli.json -r zap-sqli.html -x zap-sqli.xml -w zap-sqli.md \
            -I

      - name: Set up Python for sqlmap
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sqlmap
        if: always()
        run: pip install sqlmap

      - name: Confirm SQL injection with sqlmap
        if: always()
        run: |
          mkdir -p sqlmap-reports
          SQLMAP_DIR=$(python -c "import sqlmap, os; print(os.path.dirname(sqlmap.__file__))")
          python "$SQLMAP_DIR/sqlmap.py" \
            -u http://localhost:5012/lab \
            --data "username=admin&password=x" \
            -p username --level=2 --risk=1 --batch --flush-session \
            --output-dir=sqlmap-reports 2>&1 | tee sqlmap-reports/sqlmap.log
          echo "--- sqlmap result ---"
          grep -E "Parameter:|Type:|Title:|Payload:|back-end DBMS|injectable" \
            sqlmap-reports/sqlmap.log || true

      - name: Show DAST alert summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          for path in ("zap-reports/zap-main.json", "zap-reports/zap-sqli.json"):
              print(f"===== {path} =====")
              if not os.path.exists(path):
                  print("report was not created")
                  continue
              with open(path, encoding="utf-8") as fh:
                  report = json.load(fh)
              sites = report.get("site", [])
              alerts = []
              for site in sites:
                  alerts.extend(site.get("alerts", []))
              for alert in sorted(alerts, key=lambda a: int(a.get("riskcode", "0")), reverse=True):
                  print(
                      f"risk={alert.get('riskdesc', ''):22} "
                      f"confidence={alert.get('confidence', ''):8} "
                      f"{alert.get('name', '')} "
                      f"({alert.get('cweid', '')})"
                  )
                  for instance in alert.get("instances", [])[:3]:
                      print(f"    {instance.get('uri', '')} {instance.get('method', '')} {instance.get('param', '')}")
          PY

      - name: Write DAST job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          lines = ["### OWASP ZAP and sqlmap summary", ""]
          for path, label in (
              ("zap-reports/zap-main.json", "PyGoat main application (passive scan)"),
              ("zap-reports/zap-sqli.json", "SQL injection lab (active scan)"),
          ):
              lines.append(f"#### {label}")
              lines.append("")
              if not os.path.exists(path):
                  lines += ["Report was not created.", ""]
                  continue
              with open(path, encoding="utf-8") as fh:
                  report = json.load(fh)
              alerts = []
              for site in report.get("site", []):
                  alerts.extend(site.get("alerts", []))
              lines += [
                  "| Risk | Alert | CWE | Instances |",
                  "|---|---|---|---|",
              ]
              for alert in sorted(alerts, key=lambda a: int(a.get("riskcode", "0")), reverse=True):
                  lines.append(
                      f"| {alert.get('riskdesc', '')} | {alert.get('name', '')} | "
                      f"{alert.get('cweid', '')} | {len(alert.get('instances', []))} |"
                  )
              lines.append("")

          sqlmap_log = "sqlmap-reports/sqlmap.log"
          lines += ["#### sqlmap confirmation", ""]
          if os.path.exists(sqlmap_log):
              with open(sqlmap_log, encoding="utf-8", errors="replace") as fh:
                  text = fh.read()
              keep = [
                  line for line in text.splitlines()
                  if any(key in line for key in (
                      "Parameter:", "Type:", "Title:", "Payload:",
                      "back-end DBMS", "injectable",
                  ))
              ]
              lines += ["```", *keep[:12], "```"]
          else:
              lines.append("sqlmap log was not created.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Save container logs
        if: always()
        run: |
          mkdir -p logs
          docker logs pygoat > logs/pygoat-container.log 2>&1 || true
          docker logs pygoat-sqli > logs/sqli-lab-container.log 2>&1 || true

      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: |
            zap-reports/
            sqlmap-reports/
            logs/
